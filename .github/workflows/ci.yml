name: CI

on:
  push:
    branches: [core, main]
  pull_request:

# The three checks are exactly the ones AGENTS.md tells you to run locally
# (`mise run lint` / `typecheck` / `test`). There is no second CI path, so a
# green local run is a green CI run.
jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        # mise.toml is the single source for the bun and oxlint versions.
        uses: jdx/mise-action@v2

      - name: Install dependencies
        # bun.lock is committed, so CI installs exactly what a local run does
        # and a drifted lockfile fails the job instead of being papered over.
        run: bun install --frozen-lockfile

      - name: Patch tsc for @effect/language-service
        # TypeScript plugins are tsserver-only, so without this the typecheck
        # job would silently skip the Effect diagnostics.
        run: mise run setup

      - name: ${{ matrix.task }}
        run: mise run ${{ matrix.task }}
