# Foldcase — the typed test loop for Foldkit Showcases (Effect-4; Bun is the
# development toolchain, the published artifact runs on Node and Bun alike).
# mise owns the toolchain pin and every check command. package.json holds one
# script, `prepack`, and it calls `mise run build`: npm runs that before both
# `npm pack` and `npm publish`, so no tarball can carry a stale `dist/`. Nothing
# else is repeated there, so no task has an npm twin to drift from.

[tools]
bun = "1.3.14"
# The floor `package.json` › `engines.node` claims, pinned so every run proves
# it. 22.18.0 is the first Node that strips TypeScript types without a flag,
# which the `foldcase` bin needs to load a consumer's `*.showcase.ts`; it also
# has `module.registerHooks`, which both that bin and the coverage collector
# use. An unpinned Node would test whatever the machine happened to have.
node = "22.18.0"
# `lint` runs oxlint through `bunx`; pin it here so the mise shim resolves a
# concrete version (matches the `oxlint` devDependency in package.json).
"npm:oxlint" = "1.71.0"

[tasks.setup]
description = "One-time: patch tsc so the @effect/language-service plugin loads outside the editor"
# TypeScript plugins are tsserver-only, so `tsc --noEmit` would not see the
# Effect diagnostics without this patch. Idempotent; re-run after `bun install`.
run = """
set -e
bunx effect-language-service patch
echo 'foldcase: tsc patched for @effect/language-service'
"""

[tasks.test]
description = "The bun test suite (co-located *.test.ts, every module tested through its interface)"
# `--isolate` gives each file a fresh global object, so results are
# deterministic and order-independent. Not `--parallel`: subprocess/fs tests
# race each other for no real gain.
#
# The two directories are the suite's whole scope, the same pair `lint` lints
# and `tsconfig.json` includes. Named rather than left to a bare scan because
# `dogfood/gallery` is somebody else's repository (ADR-0005) and carries its own
# tests, written for its own runner; running them here would report a consumer's
# failures as ours. The leading `./` matters — a bare `src` is a substring
# filter and matches theirs too.
run = "bun test --isolate ./src ./test"

[tasks.lint]
description = "Syntactic gate: oxlint over src (Effect-4 idioms, import hygiene, TS cleanup)"
run = "bunx oxlint src test"

[tasks."lint:fix"]
description = "oxlint autofix (safe fixes + suggestions)"
run = "bunx oxlint src test --fix --fix-suggestions"

[tasks.typecheck]
description = "Semantic gate: patched tsc --noEmit (TS types block; Effect diagnostics ride along)"
run = "bunx tsc --noEmit"

[tasks."lint:effect"]
description = "@effect/language-service diagnostics over the whole project (standalone report)"
run = "bunx effect-language-service diagnostics --project tsconfig.json"

[tasks.build]
description = "Compile src/ to dist/ with tsc — .js + .d.ts per file, no bundler (ADR-0002 › Amendment 1)"
# `tsc -b` is the whole build. The collector is deliberately not TypeScript, so
# tsc does not move it; copy it beside its compiled caller. The exec bit is for
# running ./dist/main.js directly — npm sets it on `bin` at install time.
run = """
set -e
# The build info must go with dist/. `tsc -b` trusts it over the file system,
# so a stale one makes it skip emit entirely and leave dist/ empty.
rm -rf dist tsconfig.build.tsbuildinfo
bunx tsc -b tsconfig.build.json
mkdir -p dist/coverage
cp src/coverage/collector.mjs dist/coverage/collector.mjs
chmod +x dist/main.js dist/main.bun.js
echo 'foldcase: built dist/'
"""

[tasks.smoke]
description = "Run the built dist/ CLI end to end under BOTH runtimes (needs `mise run build` first)"
# The suite exercises the program; this exercises the *artifact*. It is the only
# check that proves the two bins exist, are executable, resolve a consumer's
# TypeScript, spawn the coverage collector out of `dist/coverage/`, and return
# the right exit code — none of which a `bun test` run can see.
run = """
set -e
if [ ! -f dist/main.js ] || [ ! -f dist/main.bun.js ]; then
  echo 'foldcase smoke: no dist/ — run `mise run build` first' >&2
  exit 1
fi
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

smoke() {
  label="$1"
  shift
  echo "── $label"

  # An unknown subcommand prints the banner and fails.
  if "$@" tset > "$tmp/out" 2>&1; then
    echo "$label: an unknown subcommand must exit non-zero" >&2
    exit 1
  fi
  grep -q 'usage: foldcase' "$tmp/out"

  # Two targets is a refusal, not a run over the first one. The dropped path
  # here is a catalog that will not load, which is exactly the request whose
  # silent half made a green exit lie.
  if "$@" test test/fixtures/counter-logic.showcase.ts test/malformed/bad-message.showcase.ts > "$tmp/out" 2>&1; then
    echo "$label: a second target must exit non-zero" >&2
    exit 1
  fi
  grep -q 'did not understand: test/malformed/bad-message.showcase.ts' "$tmp/out"

  # A passing catalog exits 0 — and loading it proves the runtime resolves a
  # consumer's extensionless TypeScript import (`./lib/counter`).
  "$@" test test/fixtures/counter-logic.showcase.ts > "$tmp/out"
  grep -q '1 total · 1 passed · 0 failed' "$tmp/out"

  # A catalog holding a failing Showcase exits non-zero.
  if "$@" test test/fixtures > "$tmp/out" 2>&1; then
    echo "$label: a failing suite must exit non-zero" >&2
    exit 1
  fi

  # A file that will not load is reported for that file, not a crash.
  if "$@" test test/malformed > "$tmp/out" 2>&1; then
    echo "$label: an unloadable catalog must exit non-zero" >&2
    exit 1
  fi
  grep -q 'bad-message.showcase.ts' "$tmp/out"

  # Coverage spawns the Node instrument copied into dist/coverage/.
  "$@" test test/fixtures/counter-logic.showcase.ts --coverage > "$tmp/out" 2>&1
  grep -q 'coverage:' "$tmp/out"

  # docs writes one Markdown file per component, where a component is an id
  # namespace. The fixtures hold two: `counter/{increment,schema}`, of which
  # only `counter/schema` declares the Schemas, and `sample/{passes,fails}`,
  # which declare none and so have nothing to table. One file, named for the
  # namespace and not for a Showcase — the count is asserted too, because
  # grouping broke last time by writing one file for everything.
  "$@" docs test/fixtures "$tmp/docs" > "$tmp/out"
  test -f "$tmp/docs/counter.md"
  test "$(ls "$tmp/docs" | wc -l)" -eq 1
  grep -q '^# counter$' "$tmp/docs/counter.md"
  grep -q 'counter/increment' "$tmp/docs/counter.md"
  rm -rf "$tmp/docs"

  # lab scaffolds the entry module a consumer's dev server builds, and stops
  # (ADR-0004) — nothing here bundles, serves or watches. The entry has to name
  # the lab entry point and reach the catalog by a relative specifier, because
  # that pair is what the consumer's bundler resolves.
  "$@" lab test/fixtures "$tmp/lab/entry.ts" > "$tmp/out"
  grep -q 'foldcase lab: wrote' "$tmp/out"
  grep -q 'from "foldcase/lab"' "$tmp/lab/entry.ts"
  grep -q 'from "\\.\\..*test/fixtures/counter-logic.showcase"' "$tmp/lab/entry.ts"

  # Written, then checked: the same catalog must read as current.
  "$@" lab --check test/fixtures "$tmp/lab/entry.ts" > "$tmp/out"
  grep -q 'is up to date' "$tmp/out"

  # And a check against an entry nobody wrote must fail, or the gate is
  # decorative. It writes nothing, so the file is still absent afterwards.
  if "$@" lab --check test/fixtures "$tmp/lab/absent.ts" > "$tmp/out" 2>&1; then
    echo "$label: a missing entry must exit non-zero under --check" >&2
    exit 1
  fi
  grep -q 'would change — missing' "$tmp/out"
  test ! -f "$tmp/lab/absent.ts"
  rm -rf "$tmp/lab"
}

smoke 'node dist/main.js' node dist/main.js
smoke 'bun dist/main.bun.js' bun dist/main.bun.js
echo 'foldcase: dist/ smoke passed under Node and Bun'
"""

[tasks.dogfood]
description = "Run the built CLI over examples/counter — real Foldkit components, both runtimes (needs `mise run build` first)"
# The fixtures under test/ are written to exercise the runner; this is the
# opposite direction — an ordinary Foldkit app, with its own package.json and
# its own Effect version, that happens to be showcased. It is the only check
# that sees the tool the way a user does: `foldkit/test` stories, a Model with
# Option and Duration in it, and a catalog installed from npm rather than
# resolved out of this repository.
run = """
set -e
if [ ! -f dist/main.js ] || [ ! -f dist/main.bun.js ]; then
  echo 'foldcase dogfood: no dist/ — run `mise run build` first' >&2
  exit 1
fi
if [ ! -d examples/counter/node_modules ]; then
  echo '── installing examples/counter'
  (cd examples/counter && bun install --frozen-lockfile)
fi
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

echo '── node dist/main.js'
node dist/main.js test examples/counter/src
echo '── bun dist/main.bun.js'
bun dist/main.bun.js test examples/counter/src

# The docs in examples/counter/docs are committed so they can be read on
# GitHub. Regenerate them here and fail on any drift, so what the repository
# shows is what the tool writes.
node dist/main.js docs examples/counter/src "$tmp/docs" > /dev/null
diff -r examples/counter/docs "$tmp/docs"
echo 'foldcase: dogfood passed — 10 Showcases, 2 documents, both runtimes'
"""

[tasks."dogfood:gallery"]
description = "Run the built CLI over the vendored @foldkit/ui gallery — 146 Showcases, 24 components, both runtimes (ADR-0005; in none of the seven checks, so it can never redden a release)"
# `dogfood` drives `examples/counter`: eight Showcases we wrote, which can only
# find what we already thought to look for. This drives an application we did
# not write — 24 components, one page each, 146 Showcases over one shared Model
# and one shared update — and it is where five defects in this tool were found.
# The gallery is a git submodule pinned to a commit and declared out of the
# stack gate's scope (ADR-0005). Nothing here builds it, lints it, typechecks
# it, ships it, or writes to it: we read it and run our own CLI against it.
run = """
set -e
if [ ! -f dogfood/gallery/package.json ]; then
  echo 'foldcase dogfood:gallery: dogfood/gallery is not checked out — run `git submodule update --init dogfood/gallery`' >&2
  exit 1
fi
if [ ! -f dist/main.js ] || [ ! -f dist/main.bun.js ]; then
  echo 'foldcase dogfood:gallery: no dist/ — run `mise run build` first' >&2
  exit 1
fi
if [ ! -d dogfood/gallery/node_modules ]; then
  echo '── installing dogfood/gallery'
  # The runtime half only, and deliberately. The gallery pins `foldcase` itself
  # at an absolute path to a tarball on the machine it was authored on, so a
  # full install succeeds only there; its Showcases import the type and nothing
  # else, so nothing under `src/ui` needs that package to run. `--omit=dev`
  # steps around the pin instead of editing somebody else's manifest, and
  # `--frozen-lockfile` keeps this from writing to their lockfile.
  if ! (cd dogfood/gallery && bun install --frozen-lockfile --omit=dev); then
    echo 'foldcase dogfood:gallery: could not install dogfood/gallery — see the error above' >&2
    exit 1
  fi
fi
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

echo '── node dist/main.js'
node dist/main.js test dogfood/gallery/src/ui > "$tmp/out"
grep -q '146 total · 146 passed · 0 failed' "$tmp/out"
echo '── bun dist/main.bun.js'
bun dist/main.bun.js test dogfood/gallery/src/ui > "$tmp/out"
grep -q '146 total · 146 passed · 0 failed' "$tmp/out"

# The same catalog through the lab's projection. An agent decodes this document,
# so what it counts has to be what the run produced, grouped the way a component
# is defined — an id namespace, one per @foldkit/ui component. The entry module
# is written into the temp directory and goes with it.
echo '── lab --json'
node dist/main.js lab --json dogfood/gallery/src/ui "$tmp/lab/entry.ts" > "$tmp/document" 2> "$tmp/err"
grep -q 'foldcase lab: wrote' "$tmp/err"
node --input-type=module -e '
  import { readFileSync } from "node:fs"
  const { catalog } = JSON.parse(readFileSync(process.argv[1], "utf8"))
  const seen = `${catalog.total} Showcases in ${catalog.components.length} components, ${catalog.failures.length} unreadable`
  const wanted = "146 Showcases in 24 components, 0 unreadable"
  if (seen !== wanted) {
    console.error(`foldcase dogfood:gallery: the lab document reports ${seen}, wanted ${wanted}`)
    process.exit(1)
  }
' "$tmp/document"
echo 'foldcase: dogfood:gallery passed — 146 Showcases, 24 components, both runtimes'
"""

[tasks."docs:build"]
description = "Build the documentation site in docs/site — derive its pages from this repository, then Vite (ADR-0003)"
# The one place in this repository where a bundler runs, and the stack gate
# names this task by hand for it (test/stack.test.ts › DECLARED_SITE_TASKS).
# The site installs with Bun into its own node_modules, the way
# `examples/counter` does, so it shares no dependency tree with the tool.
run = """
set -e
cd docs/site
if [ ! -d node_modules ]; then
  echo '── installing docs/site'
  bun install --frozen-lockfile
fi
# Every page is derived from README.md, CHANGELOG.md and docs/adr/ in the
# working tree. Nothing under docs/site/content/ is written by hand, and it is
# gitignored so nothing there can be committed and drift.
"$(mise which node)" scripts/sync-content.mjs
bunx tsc --noEmit
bunx vite build
echo 'foldcase: built docs/site/dist/'
"""

[tasks."docs:dev"]
description = "Serve the documentation site with hot reload (ADR-0003)"
run = """
set -e
cd docs/site
if [ ! -d node_modules ]; then
  bun install --frozen-lockfile
fi
"$(mise which node)" scripts/sync-content.mjs
bunx vite
"""

[tasks."docs:deploy"]
description = "Deploy docs/site to Cloudflare through alchemy (needs `alchemy configure` once)"
# alchemy runs `mise run docs:build` itself, so the build is not repeated here.
#
# Credentials never live in this repository. `alchemy configure` stores an OAuth
# token under ~/.alchemy per named profile, and this defaults to the profile
# named after the project while still honouring an ALCHEMY_PROFILE already in
# the environment. CI sets CLOUDFLARE_API_TOKEN instead, which alchemy prefers
# over any profile.
#
# The entrypoint runs under **Node**, not Bun, and that is not a preference:
# `bunx alchemy deploy` detects `bun.lock` beside it and re-executes the
# entrypoint with Bun, where Bun 1.3.14 dies — `panic(main thread):
# Segmentation fault`, after spinning a core for ten minutes first. Running the
# file directly is what the alchemy CLI would do anyway, minus its telemetry
# arguments, and Node 22.18 strips the types without a flag.
#
# `$(mise which node)`, not a bare `node`: inside a task on this machine a bare
# `node` resolves to whatever is first on PATH — a Homebrew v26.4.0 here — and
# on that version alchemy's `response.json()` throws, so every deploy dies with
# "The API returned an invalid response". `mise which` asks for the Node this
# repository pins, without repeating the version number.
run = """
set -e
cd docs/site
: "${ALCHEMY_PROFILE:=foldcase}"
export ALCHEMY_PROFILE
"$(mise which node)" alchemy.run.ts
"""

[tasks.pack]
description = "Pack the npm tarball, check what is in it, then install and run it the way a consumer does"
# `smoke` and `dogfood` drive this repository's own `dist/`. This drives the
# *tarball* — the only check that sees what npm would upload and what an
# installer would unpack. It needs no prior build: `npm pack` runs the `prepack`
# script, which is `mise run build`.
run = """
set -e
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

npm pack --pack-destination "$tmp" > /dev/null
tarball="$(ls "$tmp"/*.tgz)"
tar -tzf "$tarball" | sed 's|^package/||' | sort > "$tmp/contents"

ships() {
  grep -qx "$1" "$tmp/contents" || {
    echo "foldcase pack: the tarball is missing $1" >&2
    exit 1
  }
}
withholds() {
  ! grep -q "^$1" "$tmp/contents" || {
    echo "foldcase pack: the tarball ships $1, which stays in the repository" >&2
    exit 1
  }
}

# Both bins; the library entry a consumer imports `Showcase` from; the coverage
# instrument, which tsc does not emit and only the build task copies; and the
# four documents an installed copy has to carry on its own.
ships dist/main.js
ships dist/main.bun.js
ships dist/runner.d.ts
ships dist/coverage/collector.mjs
# The `foldcase/lab` entry point and the two modules behind it. The lab is
# ordinary TypeScript that `tsc -b` compiles like everything else (ADR-0004),
# so nothing but this proves the consumer's dev server has something to import.
ships dist/lab/index.js
ships dist/lab/index.d.ts
ships dist/lab/app.js
ships dist/lab/catalog.js
ships README.md
ships CHANGELOG.md
ships LICENSE
ships NOTICE
# What ships is the build output. The sources, the suites, the examples, the
# vendored consumer and the ADRs are read on GitHub, not downloaded on every
# install.
withholds src/
withholds test/
withholds examples/
withholds docs/
withholds dogfood/

# A directory that holds nothing of this repository but the tarball. The peer
# versions come out of devDependencies, so it installs what the repository
# develops against rather than a second pin that can drift from it.
consumer="$tmp/consumer"
mkdir -p "$consumer"
node --input-type=module -e '
  import { readFileSync, writeFileSync } from "node:fs"
  const [directory, tarball] = process.argv.slice(1)
  const developed = JSON.parse(readFileSync("package.json", "utf8")).devDependencies
  writeFileSync(`${directory}/package.json`, JSON.stringify({
    name: "foldcase-consumer",
    private: true,
    type: "module",
    dependencies: {
      foldcase: `file:${tarball}`,
      effect: developed.effect,
      "@effect/platform-bun": developed["@effect/platform-bun"],
      "@effect/platform-node": developed["@effect/platform-node"],
    },
  }, null, 2))
' "$consumer" "$tarball"

cat > "$consumer/demo.showcase.ts" <<'SHOWCASE'
import type { Showcase } from "foldcase"

const update = (count: number): number => count + 1

export const showcases: ReadonlyArray<Showcase> = [
  {
    id: "demo/increment",
    play: () => {
      if (update(1) !== 2) {
        throw new Error("update(1) should be 2")
      }
    },
  },
]
SHOWCASE

(
  cd "$consumer"
  bun install > /dev/null

  # Run the bins the way a consumer's package script does — through
  # `node_modules/.bin`, on their own shebang. That is what proves the installer
  # linked them, that they are executable, and that `#!/usr/bin/env node` and
  # `#!/usr/bin/env bun` pick the runtime each shell is written for.
  echo '── node_modules/.bin/foldcase (Node)'
  ./node_modules/.bin/foldcase test demo.showcase.ts > "$tmp/out"
  grep -q '1 total · 1 passed · 0 failed' "$tmp/out"

  echo '── node_modules/.bin/foldcase-bun (Bun)'
  ./node_modules/.bin/foldcase-bun test demo.showcase.ts > "$tmp/out"
  grep -q '1 total · 1 passed · 0 failed' "$tmp/out"

  # And the library entry resolves through `exports` under both runtimes, which
  # a bin invocation never touches.
  echo '── import "foldcase"'
  node --input-type=module -e 'import { runShowcase } from "foldcase"; if (typeof runShowcase !== "function") { process.exit(1) }'
  bun -e 'import { runShowcase } from "foldcase"; if (typeof runShowcase !== "function") { process.exit(1) }'
)

# The same tarball, installed by a consumer who took `peerDependenciesMeta` at
# its word: `foldcase` and `effect`, and neither optional platform package. Each
# bin then fails to resolve the runtime it is written for. That is expected —
# what is checked here is the *first run*: it must name the package to install
# and exit non-zero, not print a loader stack trace.
bare="$tmp/bare"
mkdir -p "$bare"
node --input-type=module -e '
  import { readFileSync, writeFileSync } from "node:fs"
  const [directory, tarball] = process.argv.slice(1)
  const developed = JSON.parse(readFileSync("package.json", "utf8")).devDependencies
  writeFileSync(`${directory}/package.json`, JSON.stringify({
    name: "foldcase-bare-consumer",
    private: true,
    type: "module",
    dependencies: { foldcase: `file:${tarball}`, effect: developed.effect },
  }, null, 2))
' "$bare" "$tarball"
cp "$consumer/demo.showcase.ts" "$bare/demo.showcase.ts"

(
  cd "$bare"
  bun install > /dev/null

  # Neither platform package may be there, or the check proves nothing.
  for platform in @effect/platform-node @effect/platform-bun; do
    ! test -d "node_modules/$platform" || {
      echo "foldcase pack: the bare consumer installed $platform, so it is not bare" >&2
      exit 1
    }
  done

  asks_for() {
    bin="$1"
    peer="$2"
    echo "── node_modules/.bin/$bin without $peer"
    if ./node_modules/.bin/"$bin" test demo.showcase.ts > "$tmp/out" 2> "$tmp/err"; then
      echo "foldcase pack: $bin must exit non-zero when $peer is missing" >&2
      exit 1
    fi
    grep -q "npm i -D $peer" "$tmp/err" || {
      echo "foldcase pack: $bin must tell the user to install $peer" >&2
      cat "$tmp/err" >&2
      exit 1
    }
    # The whole point is the absence of the raw loader failure underneath.
    ! grep -qE 'ERR_MODULE_NOT_FOUND|^ +at ' "$tmp/err" || {
      echo "foldcase pack: $bin leaked the loader error instead of explaining it" >&2
      cat "$tmp/err" >&2
      exit 1
    }
  }

  asks_for foldcase @effect/platform-node
  asks_for foldcase-bun @effect/platform-bun
)
echo 'foldcase: the tarball packs the artifact and runs installed, under Node and Bun'
"""
