# Foldcase — the typed test loop for Foldkit Showcases (Effect-4; Bun is the
# development toolchain, the published artifact runs on Node and Bun alike).
# mise owns the toolchain pin and every check command; there is deliberately no
# duplicate `scripts` block in package.json, so a task can never drift from its
# npm twin.

[tools]
bun = "1.3.14"
# The floor `package.json` › `engines.node` claims, pinned so every run proves
# it. 22.18.0 is the first Node that strips TypeScript types without a flag,
# which the `foldcase` bin needs to load a consumer's `*.showcase.ts`; it also
# has `module.registerHooks`, which both that bin and the coverage collector
# use. An unpinned Node would test whatever the machine happened to have.
node = "22.18.0"
# `lint` runs oxlint through `bunx`; pin it here so the mise shim resolves a
# concrete version (matches the `oxlint` devDependency in package.json).
"npm:oxlint" = "1.71.0"

[tasks.setup]
description = "One-time: patch tsc so the @effect/language-service plugin loads outside the editor"
# TypeScript plugins are tsserver-only, so `tsc --noEmit` would not see the
# Effect diagnostics without this patch. Idempotent; re-run after `bun install`.
run = """
set -e
bunx effect-language-service patch
echo 'foldcase: tsc patched for @effect/language-service'
"""

[tasks.test]
description = "The bun test suite (co-located *.test.ts, every module tested through its interface)"
# `--isolate` gives each file a fresh global object, so results are
# deterministic and order-independent. Not `--parallel`: subprocess/fs tests
# race each other for no real gain.
run = "bun test --isolate"

[tasks.lint]
description = "Syntactic gate: oxlint over src (Effect-4 idioms, import hygiene, TS cleanup)"
run = "bunx oxlint src test"

[tasks."lint:fix"]
description = "oxlint autofix (safe fixes + suggestions)"
run = "bunx oxlint src test --fix --fix-suggestions"

[tasks.typecheck]
description = "Semantic gate: patched tsc --noEmit (TS types block; Effect diagnostics ride along)"
run = "bunx tsc --noEmit"

[tasks."lint:effect"]
description = "@effect/language-service diagnostics over the whole project (standalone report)"
run = "bunx effect-language-service diagnostics --project tsconfig.json"

[tasks.build]
description = "Compile src/ to dist/ with tsc — .js + .d.ts per file, no bundler (ADR-0002 › Amendment 1)"
# `tsc -b` is the whole build. The collector is deliberately not TypeScript, so
# tsc does not move it; copy it beside its compiled caller. The exec bit is for
# running ./dist/main.js directly — npm sets it on `bin` at install time.
run = """
set -e
# The build info must go with dist/. `tsc -b` trusts it over the file system,
# so a stale one makes it skip emit entirely and leave dist/ empty.
rm -rf dist tsconfig.build.tsbuildinfo
bunx tsc -b tsconfig.build.json
mkdir -p dist/coverage
cp src/coverage/collector.mjs dist/coverage/collector.mjs
chmod +x dist/main.js dist/main.bun.js
echo 'foldcase: built dist/'
"""

[tasks.smoke]
description = "Run the built dist/ CLI end to end under BOTH runtimes (needs `mise run build` first)"
# The suite exercises the program; this exercises the *artifact*. It is the only
# check that proves the two bins exist, are executable, resolve a consumer's
# TypeScript, spawn the coverage collector out of `dist/coverage/`, and return
# the right exit code — none of which a `bun test` run can see.
run = """
set -e
if [ ! -f dist/main.js ] || [ ! -f dist/main.bun.js ]; then
  echo 'foldcase smoke: no dist/ — run `mise run build` first' >&2
  exit 1
fi
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

smoke() {
  label="$1"
  shift
  echo "── $label"

  # An unknown subcommand prints the banner and fails.
  if "$@" tset > "$tmp/out" 2>&1; then
    echo "$label: an unknown subcommand must exit non-zero" >&2
    exit 1
  fi
  grep -q 'usage: foldcase' "$tmp/out"

  # A passing catalog exits 0 — and loading it proves the runtime resolves a
  # consumer's extensionless TypeScript import (`./lib/counter`).
  "$@" test test/fixtures/counter-logic.showcase.ts > "$tmp/out"
  grep -q '1 total · 1 passed · 0 failed' "$tmp/out"

  # A catalog holding a failing Showcase exits non-zero.
  if "$@" test test/fixtures > "$tmp/out" 2>&1; then
    echo "$label: a failing suite must exit non-zero" >&2
    exit 1
  fi

  # A file that will not load is reported for that file, not a crash.
  if "$@" test test/malformed > "$tmp/out" 2>&1; then
    echo "$label: an unloadable catalog must exit non-zero" >&2
    exit 1
  fi
  grep -q 'bad-message.showcase.ts' "$tmp/out"

  # Coverage spawns the Node instrument copied into dist/coverage/.
  "$@" test test/fixtures/counter-logic.showcase.ts --coverage > "$tmp/out" 2>&1
  grep -q 'coverage:' "$tmp/out"

  # docs writes one Markdown file per component.
  "$@" docs test/fixtures "$tmp/docs" > "$tmp/out"
  test -f "$tmp/docs/counter-schema.md"
  rm -rf "$tmp/docs"
}

smoke 'node dist/main.js' node dist/main.js
smoke 'bun dist/main.bun.js' bun dist/main.bun.js
echo 'foldcase: dist/ smoke passed under Node and Bun'
"""

[tasks.dogfood]
description = "Run the built CLI over examples/counter — real Foldkit components, both runtimes (needs `mise run build` first)"
# The fixtures under test/ are written to exercise the runner; this is the
# opposite direction — an ordinary Foldkit app, with its own package.json and
# its own Effect version, that happens to be showcased. It is the only check
# that sees the tool the way a user does: `foldkit/test` stories, a Model with
# Option and Duration in it, and a catalog installed from npm rather than
# resolved out of this repository.
run = """
set -e
if [ ! -f dist/main.js ] || [ ! -f dist/main.bun.js ]; then
  echo 'foldcase dogfood: no dist/ — run `mise run build` first' >&2
  exit 1
fi
if [ ! -d examples/counter/node_modules ]; then
  echo '── installing examples/counter'
  (cd examples/counter && bun install --frozen-lockfile)
fi
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

echo '── node dist/main.js'
node dist/main.js test examples/counter/src
echo '── bun dist/main.bun.js'
bun dist/main.bun.js test examples/counter/src

# The docs in examples/counter/docs are committed so they can be read on
# GitHub. Regenerate them here and fail on any drift, so what the repository
# shows is what the tool writes.
node dist/main.js docs examples/counter/src "$tmp/docs" > /dev/null
diff -r examples/counter/docs "$tmp/docs"
echo 'foldcase: dogfood passed — 8 Showcases, 2 documents, both runtimes'
"""
